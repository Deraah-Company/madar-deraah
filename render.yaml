services:
  - type: web
    name: madar-deraah
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: madar-uploads
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: APP_ORIGIN
        fromService:
          type: web
          name: madar-deraah
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: "8080"
      - key: ADMIN_EMAIL
        value: admin@deraah.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: madar-deraah-db
          property: connectionString

databases:
  - name: madar-deraah-db
    databaseName: pathways
    user: pathways
    region: frankfurt
    diskSizeGB: 1
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    ipAllowList: []
